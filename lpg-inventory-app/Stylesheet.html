<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --border: #dde1e6;
    --text: #1f2328;
    --muted: #6b7280;
    --accent: #1a73e8;
    --danger: #d93025;
  }

  * { box-sizing: border-box; }

  body {
    font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 16px;
  }

  h1 {
    font-size: 20px;
    margin: 0 0 16px;
  }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 16px;
    align-items: center;
  }

  .toolbar input[type="text"],
  .toolbar select {
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 14px;
    background: var(--card);
  }

  button {
    padding: 8px 14px;
    border: none;
    border-radius: 6px;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    cursor: pointer;
  }

  button.secondary {
    background: #fff;
    color: var(--text);
    border: 1px solid var(--border);
  }

  button:disabled {
    opacity: 0.5;
    cursor: default;
  }

  .spacer { flex: 1; }

  .checkbox {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--muted);
  }

  table {
    width: 100%;
    border-collapse: collapse;
    background: var(--card);
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(0,0,0,0.06);
  }

  th, td {
    padding: 10px 12px;
    text-align: left;
    font-size: 13px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }

  th {
    background: #eef1f5;
    color: var(--muted);
    font-weight: 600;
  }

  tr:last-child td { border-bottom: none; }

  .status-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 12px;
    background: #e8f0fe;
    color: var(--accent);
  }

  .table-wrap {
    overflow-x: auto;
  }

  .empty {
    padding: 24px;
    text-align: center;
    color: var(--muted);
  }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }

  .modal {
    background: #fff;
    border-radius: 10px;
    padding: 20px;
    width: 360px;
    max-width: 90vw;
  }

  .modal h2 {
    font-size: 16px;
    margin-top: 0;
  }

  .field {
    margin-bottom: 12px;
  }

  .field label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 4px;
  }

  .field input,
  .field select {
    width: 100%;
    padding: 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 14px;
  }

  .field-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0 12px;
  }

  .modal.wide {
    width: 420px;
  }

  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 16px;
  }

  .error-text {
    color: var(--danger);
    font-size: 13px;
    margin-top: 8px;
  }

  .hint {
    color: var(--muted);
    font-size: 12px;
    margin-bottom: 12px;
  }

  .util-cell {
    line-height: 1.4;
  }

  .util-numbers {
    font-variant-numeric: tabular-nums;
  }

  .util-bar {
    position: relative;
    width: 88px;
    height: 6px;
    border-radius: 999px;
    background: #e6e9ee;
    margin-top: 4px;
    overflow: hidden;
  }

  .util-bar-fill {
    position: absolute;
    top: 0;
    left: 0;
    bottom: 0;
    border-radius: 999px;
    background: var(--accent);
  }

  .util-bar-fill.warn { background: #f9a825; }
  .util-bar-fill.over { background: var(--danger); }

  .util-empty {
    color: var(--muted);
  }
</style>
