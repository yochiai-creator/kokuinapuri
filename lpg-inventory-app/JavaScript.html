<script>
  var SIZE_KEYS = ['20', '30', '50'];
  var viewMode = 'list';
  var lastRecords = [];

  document.addEventListener('DOMContentLoaded', function () {
    search();

    document.getElementById('searchBtn').addEventListener('click', search);
    document.getElementById('addBtn').addEventListener('click', function () { openAddModal(); });
    document.getElementById('keyword').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') search();
    });
    document.getElementById('onlyNearFull').addEventListener('change', search);
    document.getElementById('viewListBtn').addEventListener('click', function () { setViewMode('list'); });
    document.getElementById('viewMapBtn').addEventListener('click', function () { setViewMode('map'); });
  });

  function setViewMode(mode) {
    viewMode = mode;
    document.getElementById('viewListBtn').classList.toggle('active', mode === 'list');
    document.getElementById('viewMapBtn').classList.toggle('active', mode === 'map');
    document.getElementById('tableView').style.display = mode === 'list' ? '' : 'none';
    document.getElementById('mapView').style.display = mode === 'map' ? '' : 'none';
    renderCurrentView();
  }

  function search() {
    var filters = {
      keyword: document.getElementById('keyword').value,
      onlyNearFull: document.getElementById('onlyNearFull').checked
    };

    google.script.run
      .withSuccessHandler(function (records) {
        lastRecords = records;
        renderCurrentView();
      })
      .withFailureHandler(showTopError)
      .getInventory(filters);
  }

  function renderCurrentView() {
    if (viewMode === 'map') {
      renderSiteMap(lastRecords);
    } else {
      renderTable(lastRecords);
    }
  }

  function renderTable(records) {
    var tbody = document.getElementById('tbody');
    var emptyMsg = document.getElementById('emptyMsg');
    tbody.innerHTML = '';

    if (!records.length) {
      emptyMsg.style.display = 'block';
      return;
    }
    emptyMsg.style.display = 'none';

    records.forEach(function (r) {
      var tr = document.createElement('tr');
      tr.innerHTML =
        '<td class="no-cell">' + escapeHtml(r.no) + '</td>' +
        '<td>' +
        '  <div class="name-cell">' + escapeHtml(r.name) + '</div>' +
        '  <div class="position-cell">' + escapeHtml(r.position) + '</div>' +
        '</td>' +
        '<td>' + utilCellHtml(r.a20, r.m20) + '</td>' +
        '<td>' + utilCellHtml(r.a30, r.m30) + '</td>' +
        '<td>' + utilCellHtml(r.a50, r.m50) + '</td>' +
        '<td class="note-cell">' + escapeHtml(r.note) + '</td>' +
        '<td class="updated-cell">' +
        '  <div>' + escapeHtml(r.updatedAt) + '</div>' +
        '  <div class="updated-by">' + escapeHtml(r.updatedBy) + '</div>' +
        '</td>' +
        '<td><button class="secondary edit-btn">編集</button></td>';

      tr.querySelector('.edit-btn').addEventListener('click', function () {
        openEditModal(r);
      });

      tbody.appendChild(tr);
    });
  }

  function utilCellHtml(actual, max) {
    actual = Number(actual) || 0;
    max = Number(max) || 0;

    if (max <= 0) {
      return '<div class="util-cell util-empty">-</div>';
    }

    var pct = Math.round((actual / max) * 100);
    var barClass = 'util-bar-fill';
    if (pct >= 100) barClass += ' over';
    else if (pct >= 80) barClass += ' warn';

    return (
      '<div class="util-cell">' +
      '  <span class="util-numbers">' + actual + ' / ' + max + ' (' + pct + '%)</span>' +
      '  <div class="util-bar"><div class="' + barClass + '" style="width:' + Math.min(100, pct) + '%"></div></div>' +
      '</div>'
    );
  }

  // 建屋ラベルが枠からはみ出さないよう、名前の長さと枠の大きさから文字サイズを決める。
  function fitBuildingLabelFontSize_(w, h, name, isNarrowTall) {
    var available = isNarrowTall ? h : w;
    var fit = (available / name.length) * 0.85;
    return Math.max(40, Math.min(145, fit));
  }

  function classifyBuilding_(name) {
    if (name.indexOf('倉庫') !== -1 || name.indexOf('置場') !== -1) return 'bldg-warehouse';
    if (name.indexOf('事務所') !== -1 || name.indexOf('室') !== -1) return 'bldg-office';
    return 'bldg-factory';
  }

  function renderSiteMap(records) {
    var svg = document.getElementById('siteMapSvg');
    var svgNS = 'http://www.w3.org/2000/svg';
    svg.innerHTML = '';

    var ground = document.createElementNS(svgNS, 'rect');
    ground.setAttribute('class', 'site-ground-rect');
    ground.setAttribute('x', -300);
    ground.setAttribute('y', -300);
    ground.setAttribute('width', 17300);
    ground.setAttribute('height', 12700);
    svg.appendChild(ground);

    var boundary = document.createElementNS(svgNS, 'polygon');
    boundary.setAttribute('class', 'site-boundary-rect');
    boundary.setAttribute('points', SITE_BOUNDARY.map(function (p) { return p.x + ',' + p.y; }).join(' '));
    svg.appendChild(boundary);

    SITE_ROAD_LINES.forEach(function (l) {
      var road = document.createElementNS(svgNS, 'line');
      road.setAttribute('class', 'site-road-line');
      road.setAttribute('x1', l.x1);
      road.setAttribute('y1', l.y1);
      road.setAttribute('x2', l.x2);
      road.setAttribute('y2', l.y2);
      svg.appendChild(road);

      var roadMark = document.createElementNS(svgNS, 'line');
      roadMark.setAttribute('class', 'site-road-line-mark');
      roadMark.setAttribute('x1', l.x1);
      roadMark.setAttribute('y1', l.y1);
      roadMark.setAttribute('x2', l.x2);
      roadMark.setAttribute('y2', l.y2);
      svg.appendChild(roadMark);
    });

    var pond = document.createElementNS(svgNS, 'polygon');
    pond.setAttribute('class', 'site-pond');
    pond.setAttribute('points', SITE_POND.map(function (p) { return p.x + ',' + p.y; }).join(' '));
    svg.appendChild(pond);

    SITE_UNLABELED.forEach(function (u) {
      var rect = document.createElementNS(svgNS, 'rect');
      rect.setAttribute('class', 'site-unlabeled-rect');
      rect.setAttribute('x', u.x);
      rect.setAttribute('y', u.y);
      rect.setAttribute('width', u.w);
      rect.setAttribute('height', u.h);
      svg.appendChild(rect);
    });

    SITE_BUILDINGS.forEach(function (b) {
      var category = classifyBuilding_(b.name);

      var rect = document.createElementNS(svgNS, 'rect');
      rect.setAttribute('class', 'site-building-rect ' + category);
      rect.setAttribute('x', b.x);
      rect.setAttribute('y', b.y);
      rect.setAttribute('width', b.w);
      rect.setAttribute('height', b.h);
      svg.appendChild(rect);

      var roofH = Math.min(b.h * 0.24, 130);
      var roof = document.createElementNS(svgNS, 'rect');
      roof.setAttribute('class', 'site-roof ' + category);
      roof.setAttribute('x', b.x);
      roof.setAttribute('y', b.y);
      roof.setAttribute('width', b.w);
      roof.setAttribute('height', roofH);
      svg.appendChild(roof);

      var cx = b.x + b.w / 2;
      var cy = b.y + b.h / 2;
      var isNarrowTall = b.h > b.w * 1.3;

      var text = document.createElementNS(svgNS, 'text');
      text.setAttribute('class', 'site-building-label');
      text.setAttribute('x', cx);
      text.setAttribute('y', cy);
      text.setAttribute('dominant-baseline', 'central');
      text.style.fontSize = fitBuildingLabelFontSize_(b.w, b.h, b.name, isNarrowTall) + 'px';
      if (isNarrowTall) {
        text.setAttribute('transform', 'rotate(-90 ' + cx + ' ' + cy + ')');
      }
      text.textContent = b.name;
      svg.appendChild(text);
    });

    SITE_BUILDING_SHAPES.forEach(function (b) {
      var category = classifyBuilding_(b.name);
      var xs = b.points.map(function (p) { return p[0]; });
      var ys = b.points.map(function (p) { return p[1]; });
      var minX = Math.min.apply(null, xs), maxX = Math.max.apply(null, xs);
      var minY = Math.min.apply(null, ys), maxY = Math.max.apply(null, ys);

      var polygon = document.createElementNS(svgNS, 'polygon');
      polygon.setAttribute('class', 'site-building-rect ' + category);
      polygon.setAttribute('points', b.points.map(function (p) { return p[0] + ',' + p[1]; }).join(' '));
      svg.appendChild(polygon);

      var cx = (minX + maxX) / 2;
      var cy = (minY + maxY) / 2;
      var shapeW = maxX - minX, shapeH = maxY - minY;
      var isNarrowTall = shapeH > shapeW * 1.3;

      var text = document.createElementNS(svgNS, 'text');
      text.setAttribute('class', 'site-building-label');
      text.setAttribute('x', cx);
      text.setAttribute('y', cy);
      text.setAttribute('dominant-baseline', 'central');
      text.style.fontSize = fitBuildingLabelFontSize_(shapeW, shapeH, b.name, isNarrowTall) + 'px';
      if (isNarrowTall) {
        text.setAttribute('transform', 'rotate(-90 ' + cx + ' ' + cy + ')');
      }
      text.textContent = b.name;
      svg.appendChild(text);
    });

    var unmatchedContainer = document.getElementById('unmatchedCards');
    unmatchedContainer.innerHTML = '';

    records.forEach(function (r) {
      var pos = LOCATION_MARKER_POS[r.no];
      var pct = maxUtilizationPct(r);
      var levelClass = 'level-empty';
      if (pct !== null) {
        levelClass = pct >= 100 ? 'level-over' : (pct >= 80 ? 'level-warn' : 'level-ok');
      }

      if (pos) {
        var g = document.createElementNS(svgNS, 'g');
        g.setAttribute('class', 'site-marker ' + levelClass);

        var pinR = 165;
        var bubbleCy = pos.y - pinR * 1.5;

        var shadow = document.createElementNS(svgNS, 'ellipse');
        shadow.setAttribute('class', 'site-marker-shadow');
        shadow.setAttribute('cx', pos.x);
        shadow.setAttribute('cy', pos.y + 14);
        shadow.setAttribute('rx', pinR * 0.5);
        shadow.setAttribute('ry', pinR * 0.2);
        g.appendChild(shadow);

        var tail = document.createElementNS(svgNS, 'polygon');
        tail.setAttribute('points',
          (pos.x - pinR * 0.55) + ',' + (bubbleCy + pinR * 0.7) + ' ' +
          (pos.x + pinR * 0.55) + ',' + (bubbleCy + pinR * 0.7) + ' ' +
          pos.x + ',' + pos.y
        );
        g.appendChild(tail);

        var circle = document.createElementNS(svgNS, 'circle');
        circle.setAttribute('cx', pos.x);
        circle.setAttribute('cy', bubbleCy);
        circle.setAttribute('r', pinR);
        g.appendChild(circle);

        var label = document.createElementNS(svgNS, 'text');
        label.setAttribute('x', pos.x);
        label.setAttribute('y', bubbleCy);
        label.textContent = r.no;
        g.appendChild(label);

        g.addEventListener('click', function () { openEditModal(r); });
        svg.appendChild(g);
      } else {
        var card = document.createElement('div');
        card.className = 'map-card ' + levelClass;
        card.innerHTML =
          '<div class="map-no">' + escapeHtml(r.no) + '</div>' +
          '<div class="map-name">' + escapeHtml(r.name) + (r.position ? '(' + escapeHtml(r.position) + ')' : '') + '</div>' +
          '<div class="map-pct">' + (pct === null ? '-' : pct + '%') + '</div>';

        card.addEventListener('click', function () { openEditModal(r); });
        unmatchedContainer.appendChild(card);
      }
    });
  }

  function maxUtilizationPct(r) {
    var best = null;
    SIZE_KEYS.forEach(function (key) {
      var actual = Number(r['a' + key]) || 0;
      var max = Number(r['m' + key]) || 0;
      if (max > 0) {
        var pct = Math.round((actual / max) * 100);
        if (best === null || pct > best) best = pct;
      }
    });
    return best;
  }

  function openEditModal(record) {
    var html =
      '<div class="modal-backdrop" id="modalBackdrop">' +
      '  <div class="modal wide">' +
      '    <h2>置場を編集: ' + escapeHtml(record.no) + ' ' + escapeHtml(record.name) + '</h2>' +
      '    <div class="field"><label>置場名</label><input id="f_name" value="' + escapeAttr(record.name) + '"></div>' +
      '    <div class="field"><label>位置</label><input id="f_position" value="' + escapeAttr(record.position) + '"></div>' +
      '    <div class="field-grid">' +
      '      <div class="field"><label>20kg 実績</label><input id="f_a20" type="number" value="' + numAttr(record.a20) + '"></div>' +
      '      <div class="field"><label>20kg MAX</label><input id="f_m20" type="number" value="' + numAttr(record.m20) + '"></div>' +
      '      <div class="field"><label>30kg 実績</label><input id="f_a30" type="number" value="' + numAttr(record.a30) + '"></div>' +
      '      <div class="field"><label>30kg MAX</label><input id="f_m30" type="number" value="' + numAttr(record.m30) + '"></div>' +
      '      <div class="field"><label>50kg 実績</label><input id="f_a50" type="number" value="' + numAttr(record.a50) + '"></div>' +
      '      <div class="field"><label>50kg MAX</label><input id="f_m50" type="number" value="' + numAttr(record.m50) + '"></div>' +
      '    </div>' +
      '    <div class="field"><label>備考</label><input id="f_note" value="' + escapeAttr(record.note) + '"></div>' +
      '    <div id="modalError" class="error-text"></div>' +
      '    <div class="modal-actions">' +
      '      <button class="secondary" id="modalCancel">キャンセル</button>' +
      '      <button id="modalSave">保存</button>' +
      '    </div>' +
      '  </div>' +
      '</div>';

    document.getElementById('modalRoot').innerHTML = html;
    document.getElementById('modalCancel').addEventListener('click', closeModal);

    document.getElementById('modalSave').addEventListener('click', function () {
      var updates = {
        name: document.getElementById('f_name').value,
        position: document.getElementById('f_position').value,
        a20: document.getElementById('f_a20').value,
        m20: document.getElementById('f_m20').value,
        a30: document.getElementById('f_a30').value,
        m30: document.getElementById('f_m30').value,
        a50: document.getElementById('f_a50').value,
        m50: document.getElementById('f_m50').value,
        note: document.getElementById('f_note').value
      };

      var btn = document.getElementById('modalSave');
      btn.disabled = true;

      google.script.run
        .withSuccessHandler(function () {
          closeModal();
          search();
        })
        .withFailureHandler(function (err) {
          btn.disabled = false;
          document.getElementById('modalError').textContent = err.message || String(err);
        })
        .updateLocation(record.no, updates);
    });
  }

  function openAddModal() {
    var html =
      '<div class="modal-backdrop" id="modalBackdrop">' +
      '  <div class="modal wide">' +
      '    <h2>新規置場を登録</h2>' +
      '    <div class="field"><label>番号 *</label><input id="f_no"></div>' +
      '    <div class="field"><label>置場名</label><input id="f_name"></div>' +
      '    <div class="field"><label>位置</label><input id="f_position"></div>' +
      '    <div class="field-grid">' +
      '      <div class="field"><label>20kg 実績</label><input id="f_a20" type="number" value="0"></div>' +
      '      <div class="field"><label>20kg MAX</label><input id="f_m20" type="number" value="0"></div>' +
      '      <div class="field"><label>30kg 実績</label><input id="f_a30" type="number" value="0"></div>' +
      '      <div class="field"><label>30kg MAX</label><input id="f_m30" type="number" value="0"></div>' +
      '      <div class="field"><label>50kg 実績</label><input id="f_a50" type="number" value="0"></div>' +
      '      <div class="field"><label>50kg MAX</label><input id="f_m50" type="number" value="0"></div>' +
      '    </div>' +
      '    <div class="field"><label>備考</label><input id="f_note"></div>' +
      '    <div id="modalError" class="error-text"></div>' +
      '    <div class="modal-actions">' +
      '      <button class="secondary" id="modalCancel">キャンセル</button>' +
      '      <button id="modalSave">登録</button>' +
      '    </div>' +
      '  </div>' +
      '</div>';

    document.getElementById('modalRoot').innerHTML = html;
    document.getElementById('modalCancel').addEventListener('click', closeModal);

    document.getElementById('modalSave').addEventListener('click', function () {
      var data = {
        no: document.getElementById('f_no').value.trim(),
        name: document.getElementById('f_name').value,
        position: document.getElementById('f_position').value,
        a20: document.getElementById('f_a20').value,
        m20: document.getElementById('f_m20').value,
        a30: document.getElementById('f_a30').value,
        m30: document.getElementById('f_m30').value,
        a50: document.getElementById('f_a50').value,
        m50: document.getElementById('f_m50').value,
        note: document.getElementById('f_note').value
      };

      if (!data.no) {
        document.getElementById('modalError').textContent = '番号は必須です';
        return;
      }

      var btn = document.getElementById('modalSave');
      btn.disabled = true;

      google.script.run
        .withSuccessHandler(function () {
          closeModal();
          search();
        })
        .withFailureHandler(function (err) {
          btn.disabled = false;
          document.getElementById('modalError').textContent = err.message || String(err);
        })
        .addLocation(data);
    });
  }

  function closeModal() {
    document.getElementById('modalRoot').innerHTML = '';
  }

  function showTopError(err) {
    alert('エラー: ' + (err.message || String(err)));
  }

  function numAttr(v) {
    return (v === null || v === undefined || v === '') ? 0 : v;
  }

  function escapeHtml(v) {
    if (v === null || v === undefined) return '';
    return String(v)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  function escapeAttr(v) {
    if (v === null || v === undefined) return '';
    return String(v)
      .replace(/&/g, '&amp;')
      .replace(/"/g, '&quot;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }
</script>
